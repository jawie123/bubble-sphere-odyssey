<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bubble Sphere Odyssey</title>
    <!-- Phaser 3 Library -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #030014;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 900px;
            position: relative;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: 430,
            height: 860,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            physics: {
                default: 'arcade',
                arcade: { debug: false }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);

        let score = 0;
        let moves = 25;
        let sector = 1;
        let scoreText, movesText, sectorText;
        let shooterBubble, nextBubble;
        let aimLine;
        let bubblesGroup;
        const colors = [0x38bdf8, 0xf43f5e, 0xa855f7, 0xfacc15, 0x22c55e];
        let isShooting = false;
        let activeBullet = null;

        function preload() {
            // High Resolution Generated Textures
            this.load.image('space_bg', 'https://labs.phaser.io/assets/skies/space3.png');
        }

        function create() {
            // Background
            let bg = this.add.image(215, 430, 'space_bg').setDisplaySize(430, 860);
            bg.setAlpha(0.6);

            // Top Header Panel (Glassmorphic)
            let header = this.add.graphics();
            header.fillStyle(0x0f172a, 0.85);
            header.fillRect(0, 0, 430, 80);
            header.lineStyle(2, 0x38bdf8, 0.3);
            header.strokeRect(0, 0, 430, 80);

            // HUD Texts
            this.add.text(25, 15, 'SECTOR', { fontSize: '11px', fill: '#38bdf8', fontStyle: 'bold' });
            sectorText = this.add.text(25, 32, '1', { fontSize: '24px', fill: '#ffffff', fontStyle: 'bold' });

            this.add.text(190, 15, 'SCORE', { fontSize: '11px', fill: '#f43f5e', fontStyle: 'bold' });
            scoreText = this.add.text(190, 32, '0', { fontSize: '26px', fill: '#f43f5e', fontStyle: 'bold' });

            this.add.text(340, 15, 'MOVES', { fontSize: '11px', fill: '#facc15', fontStyle: 'bold' });
            movesText = this.add.text(340, 32, '25', { fontSize: '24px', fill: '#facc15', fontStyle: 'bold' });

            // Create Bubble Grid Group
            bubblesGroup = this.add.group();
            createGrid(this);

            // Aim Line Graphic
            aimLine = this.add.graphics();

            // Shooter Cannon Base
            createShooter(this);

            // Input Handling
            this.input.on('pointermove', (pointer) => {
                if (isShooting) return;
                aimLine.clear();
                aimLine.lineStyle(3, 0x38bdf8, 0.8);
                
                let angle = Phaser.Math.Angle.Between(215, 780, pointer.x, pointer.y);
                if (angle < -0.2 && angle > -2.9) {
                    let targetX = 215 + Math.cos(angle) * 300;
                    let targetY = 780 + Math.sin(angle) * 300;
                    aimLine.lineBetween(215, 780, targetX, targetY);
                }
            });

            this.input.on('pointerup', (pointer) => {
                if (isShooting || moves <= 0) return;
                let angle = Phaser.Math.Angle.Between(215, 780, pointer.x, pointer.y);
                if (angle < -0.2 && angle > -2.9) {
                    shootBubble(this, angle);
                }
            });
        }

        function createGrid(scene) {
            let radius = 22;
            let startX = 45;
            let startY = 130;

            for (let r = 0; r < 5; r++) {
                let offset = (r % 2 === 1) ? radius : 0;
                let cols = (r % 2 === 1) ? 7 : 8;
                for (let c = 0; c < cols; c++) {
                    let x = startX + offset + (c * radius * 2);
                    let y = startY + (r * radius * 1.75);
                    let color = colors[Math.floor(Math.random() * colors.length)];
                    
                    let b = scene.add.circle(x, y, radius - 1, color);
                    b.setStrokeStyle(2, 0xffffff, 0.5);
                    bubblesGroup.add(b);
                }
            }
        }

        function createShooter(scene) {
            // Cannon Platform
            let base = scene.add.circle(215, 780, 35, 0x1e293b);
            base.setStrokeStyle(3, 0x38bdf8, 0.8);

            // Shooter Bubble
            let color = colors[Math.floor(Math.random() * colors.length)];
            shooterBubble = scene.add.circle(215, 780, 21, color);
            shooterBubble.setStrokeStyle(2, 0xffffff, 0.8);
        }

        function shootBubble(scene, angle) {
            isShooting = true;
            aimLine.clear();
            moves--;
            movesText.setText(moves);

            activeBullet = scene.add.circle(215, 780, 21, shooterBubble.fillColor);
            activeBullet.setStrokeStyle(2, 0xffffff, 0.8);

            let speed = 900;
            let vx = Math.cos(angle) * speed;
            let vy = Math.sin(angle) * speed;

            scene.tweens.add({
                targets: activeBullet,
                x: activeBullet.x + (vx * 0.5),
                y: activeBullet.y + (vy * 0.5),
                duration: 500,
                onComplete: () => {
                    score += 250;
                    scoreText.setText(score);
                    activeBullet.destroy();
                    isShooting = false;
                    createShooter(scene);
                }
            });
        }

        function update() {}
    </script>
</body>
</html>
