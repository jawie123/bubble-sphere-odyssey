<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bubble Sphere Odyssey</title>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #030014;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center w-screen h-screen">
  <div class="relative w-full max-w-md h-full max-h-[920px] flex flex-col justify-between items-center overflow-hidden bg-slate-950 border border-purple-900/40 neon-glow rounded-none sm:rounded-3xl">
    
    <!-- Top HUD Bar -->
    <header class="w-full px-5 py-3 glass-panel z-10 flex items-center justify-between">
      <div class="flex flex-col items-start">
        <span class="text-[10px] text-cyan-400 font-black tracking-widest uppercase">Sector</span>
        <span id="levelDisplay" class="text-xl font-black text-white drop-shadow">1</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="text-[10px] text-pink-400 font-black tracking-widest uppercase">Score</span>
        <span id="scoreDisplay" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">0</span>
      </div>
      <div class="flex flex-col items-end">
        <span class="text-[10px] text-amber-400 font-black tracking-widest uppercase">Moves</span>
        <span id="movesDisplay" class="text-xl font-black text-amber-300 drop-shadow">25</span>
      </div>
    </header>

    <!-- Canvas Stage -->
    <main class="relative w-full flex-1 flex items-center justify-center overflow-hidden">
      <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let level = 1;
    let score = 0;
    let moves = 25;

    // High Quality 3D Sphere Color Palette
    const SPHERES = [
      { id: 'cyan', core: '#e0f2fe', mid: '#38bdf8', dark: '#0284c7', glow: 'rgba(56, 189, 248, 0.6)' },
      { id: 'pink', core: '#ffe4e6', mid: '#f43f5e', dark: '#be123c', glow: 'rgba(244, 63, 94, 0.6)' },
      { id: 'purple', core: '#f3e8ff', mid: '#c084fc', dark: '#7e22ce', glow: 'rgba(192, 132, 252, 0.6)' },
      { id: 'gold', core: '#fef9c3', mid: '#facc15', dark: '#ca8a04', glow: 'rgba(250, 204, 21, 0.6)' },
      { id: 'green', core: '#dcfce7', mid: '#4ade80', dark: '#15803d', glow: 'rgba(74, 222, 128, 0.6)' }
    ];

    const RADIUS = 20;
    let grid = [];
    const ROWS = 9;
    const COLS = 8;

    let currentBubble = null;
    let bullet = null;
    let aimAngle = -Math.PI / 2;
    let isAiming = false;
    let particles = [];
    let floatingScores = [];

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      initGrid();
      spawnCurrentBubble();
    }
    window.addEventListener('resize', resize);

    function initGrid() {
      grid = [];
      const startX = (canvas.width - (COLS * RADIUS * 2)) / 2 + RADIUS;
      for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        const isOffset = r % 2 === 1;
        const xOffset = isOffset ? RADIUS : 0;
        const colsCount = isOffset ? COLS - 1 : COLS;
        
        for (let c = 0; c < colsCount; c++) {
          if (r < 5) {
            grid[r][c] = {
              x: startX + xOffset + c * RADIUS * 2,
              y: 60 + r * (RADIUS * 1.73),
              sphere: SPHERES[Math.floor(Math.random() * SPHERES.length)]
            };
          } else {
            grid[r][c] = null;
          }
        }
      }
    }

    function spawnCurrentBubble() {
      currentBubble = {
        x: canvas.width / 2,
        y: canvas.height - 70,
        sphere: SPHERES[Math.floor(Math.random() * SPHERES.length)]
      };
    }

    function updateHUD() {
      document.getElementById('levelDisplay').innerText = level;
      document.getElementById('scoreDisplay').innerText = score.toLocaleString();
      document.getElementById('movesDisplay').innerText = moves;
    }

    // High End 3D Sphere Renderer (Glossy 3D Shading)
    function render3DSphere(x, y, sphereObj, scale = 1) {
      const r = RADIUS * scale;
      ctx.save();

      // Outer Glow Aura
      ctx.beginPath();
      ctx.arc(x, y, r + 4, 0, Math.PI * 2);
      ctx.fillStyle = sphereObj.glow;
      ctx.fill();

      // 3D Spherical Gradient
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      let grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.05, x, y, r);
      grad.addColorStop(0, sphereObj.core);
      grad.addColorStop(0.3, sphereObj.mid);
      grad.addColorStop(0.85, sphereObj.dark);
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.fill();

      // Specular Reflection Highlight (Glass Reflection)
      ctx.beginPath();
      ctx.arc(x - r * 0.38, y - r * 0.38, r * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.fill();

      ctx.restore();
    }

    function drawAimTrajectory() {
      if (!isAiming || bullet) return;

      const startX = canvas.width / 2;
      const startY = canvas.height - 70;

      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([6, 8]);
      ctx.moveTo(startX, startY);

      let endX = startX + Math.cos(aimAngle) * 350;
      let endY = startY + Math.sin(aimAngle) * 350;

      ctx.lineTo(endX, endY);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
      ctx.lineWidth = 3.5;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;
      ctx.stroke();
      ctx.restore();
    }

    function triggerExplosion(x, y, sphereObj) {
      for (let i = 0; i < 18; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.5) * 12,
          color: sphereObj.mid,
          size: Math.random() * 4 + 2,
          life: 1.0
        });
      }
      floatingScores.push({
        x: x,
        y: y,
        text: '+500 POP!',
        life: 1.0
      });
    }

    function updateParticlesAndFX() {
      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.035;

        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      // Floating Score Texts
      for (let i = floatingScores.length - 1; i >= 0; i--) {
        let fs = floatingScores[i];
        fs.y -= 1.2;
        fs.life -= 0.025;

        if (fs.life <= 0) {
          floatingScores.splice(i, 1);
        } else {
          ctx.save();
          ctx.font = '900 14px sans-serif';
          ctx.fillStyle = `rgba(250, 204, 21, ${fs.life})`;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.fillText(fs.text, fs.x - 20, fs.y);
          ctx.restore();
        }
      }
    }

    function shoot() {
      if (bullet || moves <= 0) return;
      bullet = {
        x: currentBubble.x,
        y: currentBubble.y,
        vx: Math.cos(aimAngle) * 16,
        vy: Math.sin(aimAngle) * 16,
        sphere: currentBubble.sphere
      };
      moves--;
      updateHUD();
      spawnCurrentBubble();
    }

    function updateBullet() {
      if (!bullet) return;

      bullet.x += bullet.vx;
      bullet.y += bullet.vy;

      // Wall Bounce
      if (bullet.x - RADIUS <= 10 || bullet.x + RADIUS >= canvas.width - 10) {
        bullet.vx *= -1;
      }

      // Top Hit
      if (bullet.y - RADIUS <= 50) {
        snapToGrid();
        return;
      }

      // Grid Collision
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          let b = grid[r][c];
          if (b) {
            let dist = Math.hypot(bullet.x - b.x, bullet.y - b.y);
            if (dist < RADIUS * 1.85) {
              snapToGrid();
              return;
            }
          }
        }
      }
    }

    function snapToGrid() {
      triggerExplosion(bullet.x, bullet.y, bullet.sphere);
      score += 500;
      updateHUD();
      bullet = null;
    }

    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const mouseX = clientX - rect.left;
      const mouseY = clientY - rect.top;

      const shooterX = canvas.width / 2;
      const shooterY = canvas.height - 70;

      aimAngle = Math.atan2(mouseY - shooterY, mouseX - shooterX);
      if (aimAngle > -0.15) aimAngle = -0.15;
      if (aimAngle < -Math.PI + 0.15) aimAngle = -Math.PI + 0.15;
      isAiming = true;
    }

    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handlePointerMove(e); }, { passive: false });

    canvas.addEventListener('mouseup', () => { isAiming = false; shoot(); });
    canvas.addEventListener('touchend', () => { isAiming = false; shoot(); });

    function renderBackgroundGrid() {
      ctx.fillStyle = '#030014';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Starfield dots
      ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      for (let i = 0; i < 40; i++) {
        let x = (i * 97) % canvas.width;
        let y = (i * 133) % canvas.height;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
    }

    function loop() {
      renderBackgroundGrid();
      drawAimTrajectory();

      // Draw Grid Spheres
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          if (grid[r] && grid[r][c]) {
            render3DSphere(grid[r][c].x, grid[r][c].y, grid[r][c].sphere);
          }
        }
      }

      // Draw Active Bullet
      if (bullet) {
        render3DSphere(bullet.x, bullet.y, bullet.sphere);
        updateBullet();
      }

      // Draw Shooter Base & Current Sphere
      if (currentBubble) {
        render3DSphere(currentBubble.x, currentBubble.y, currentBubble.sphere);
      }

      updateParticlesAndFX();
      requestAnimationFrame(loop);
    }

    resize();
    loop();
  </script>
</body>
</html>
