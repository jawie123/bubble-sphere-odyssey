name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Keystore and Build Signed AAB & Debug APK
        run: |
          cd android

          # 1. Generate Keystore File
          keytool -genkeypair -v \
            -keystore my-release-key.keystore \
            -alias my-key-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "password123" \
            -keypass "password123" \
            -dname "CN=BubbleSphere, OU=Development, O=BubbleSphere, L=City, ST=State, C=US"

          chmod +x gradlew

          # 2. Build Signed Release AAB
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/my-release-key.keystore \
            -Pandroid.injected.signing.store.password=password123 \
            -Pandroid.injected.signing.key.alias=my-key-alias \
            -Pandroid.injected.signing.key.password=password123

          # 3. Build Debug APK
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleSphereOdyssey-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release AAB (For Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: BubbleSphereOdyssey-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
