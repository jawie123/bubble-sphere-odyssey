name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Assets
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Release Key & Build Signed AAB
        run: |
          cd android
          keytool -genkeypair -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass mysecretpass -keypass mysecretpass -dname "CN=BubbleSphere, OU=Dev, O=Dev, L=City, ST=State, C=US"
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=mysecretpass \
            -Pandroid.injected.signing.key.alias=releasekey \
            -Pandroid.injected.signing.key.password=mysecretpass
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleSphereOdyssey-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release AAB (For Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: BubbleSphereOdyssey-Signed-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
